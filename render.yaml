services:
  - type: web
    name: codeatlas-api
    runtime: docker
    plan: free
    branch: develop
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAX_REPOSITORIES
        value: "2"
      - key: MAX_REPOSITORY_SIZE_KB
        value: "10000"
